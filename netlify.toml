# Hosting for the demo page. The page is prebuilt and committed (python src/build_console.py),
# so Netlify only publishes the folder.
[build]
  publish = "app/site"
  command = "echo 'site is prebuilt'"
  # Deploy only when the published page changes: each production deploy uses plan credits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- app/site netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
