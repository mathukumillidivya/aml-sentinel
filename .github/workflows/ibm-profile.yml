name: IBM dataset profile
on:
  workflow_dispatch:
    inputs:
      name:
        description: Dataset variant
        default: HI-Small
permissions:
  contents: write
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      NAME: ${{ inputs.name }}
      DATASET: ealtman2019/ibm-transactions-for-anti-money-laundering-aml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt "kaggle>=1.8.0"
      - uses: actions/cache@v4
        id: data
        with:
          path: data/ibm
          key: ibm-${{ inputs.name }}-v1
      - name: Download from Kaggle
        if: steps.data.outputs.cache-hit != 'true'
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo "KAGGLE_API_TOKEN secret is missing"; exit 1; }
          mkdir -p data/ibm
          kaggle datasets files "$DATASET" || true
          for f in "${NAME}_Trans.csv" "${NAME}_Patterns.txt"; do
            kaggle datasets download "$DATASET" -f "$f" -p data/ibm
          done
          cd data/ibm && for z in *.zip; do [ -f "$z" ] && unzip -o "$z" && rm "$z"; done; ls -la
      - run: python src/ibm_profile.py --name "$NAME"
      - name: Save profile and small sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/ibm data/ibm_sample
          git commit -m "Add IBM $NAME profile" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
