<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AML Sentinel, follow the money</title>
<meta name="description" content="Money-laundering alert triage on the IBM AML benchmark: rules raise alerts, a model ranks them, an AI agent traces the money and drafts the case file, a person decides.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2304211A'/%3E%3Ccircle cx='10' cy='22' r='3' fill='%232EF2A6'/%3E%3Ccircle cx='22' cy='10' r='4' fill='%23FFC23D'/%3E%3Cpath d='M10 22 L22 10' stroke='%232EF2A6' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #04211A; --bg2: #072A21; --panel: #0B3328; --panel2: #0F3D30; --line: #1D5443; --line2: #2A6B57;
  --text: #E4F5EC; --dim: #8FB8A7; --faint: #5F8E7C;
  --mint: #2EF2A6; --mint-dim: #1C9E6E; --gold: #FFC23D; --gold-deep: #E0A100; --coral: #FF7A66; --sky: #8ED8FF;
  --serif: "Fraunces", Georgia, serif; --sans: "Public Sans", system-ui, sans-serif; --mono: "DM Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--mint); text-underline-offset: 3px; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: -0.01em; color: #fff; }
h2 { font-size: clamp(30px, 3.6vw, 48px); line-height: 1.05; }
h3 { font-size: 21px; line-height: 1.25; }
p { margin: 0 0 14px; max-width: 66ch; }
.muted { color: var(--dim); }
.mono { font-family: var(--mono); }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 32px; }

.top { position: sticky; top: 0; z-index: 30; background: rgba(4, 33, 26, .9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 30px; height: 64px; }
.brand { display: flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; font: 600 21px var(--serif); }
.brand svg { width: 30px; height: 30px; }
.nav { display: flex; gap: 4px; }
.nav a { color: var(--dim); text-decoration: none; padding: 7px 14px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
.nav a:hover { color: #fff; }
.nav a[aria-current="page"] { color: var(--bg); background: var(--mint); }
.top .meta { margin-left: auto; font: 400 13px var(--mono); color: var(--faint); white-space: nowrap; }

.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 12px 22px; font-weight: 600; text-decoration: none; cursor: pointer; border: 1px solid var(--line2); background: transparent; color: var(--text); }
.btn:hover { border-color: var(--mint); color: #fff; }
.btn.go { background: var(--mint); border-color: var(--mint); color: var(--bg); }
.btn.go:hover { background: #fff; border-color: #fff; color: var(--bg); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1F1600; }
.btn:disabled { opacity: .4; pointer-events: none; }

/* home */
.hero { position: relative; min-height: min(820px, calc(100vh - 64px)); overflow: hidden; border-bottom: 1px solid var(--line); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .wrap { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; min-height: inherit; align-content: center; padding-top: 64px; padding-bottom: 64px; pointer-events: none; }
.hero .copy { grid-column: 1 / span 6; pointer-events: auto; }
.hero h1 { font-size: clamp(54px, 7.4vw, 112px); line-height: .92; font-weight: 600; letter-spacing: -0.03em; }
.hero h1 em { font-style: italic; color: var(--mint); font-weight: 400; }
.hero .lede { font-size: 19px; line-height: 1.55; margin: 26px 0 30px; max-width: 40ch; color: #CFE6DB; }
.hero .acts { display: flex; gap: 12px; flex-wrap: wrap; }
.hero .tag { position: absolute; z-index: 3; pointer-events: none; font: 500 13px var(--mono); color: var(--gold); background: rgba(4,33,26,.88); border: 1px solid var(--gold-deep); padding: 8px 12px; border-radius: 10px; opacity: 0; transition: opacity .6s; max-width: 280px; }
.hero .tag.on { opacity: 1; }
.hero .tag b { display: block; color: #fff; font: 600 17px var(--serif); margin-top: 2px; }
.shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(4,33,26,.96) 0%, rgba(4,33,26,.82) 34%, rgba(4,33,26,0) 62%); z-index: 1; pointer-events: none; }

.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-bottom: 1px solid var(--line); }
.strip div { padding: 28px 28px 30px 0; border-right: 1px solid var(--line); }
.strip div + div { padding-left: 28px; }
.strip div:last-child { border-right: 0; }
.strip b { display: block; font: 600 clamp(38px, 4vw, 56px)/1 var(--serif); color: #fff; letter-spacing: -0.02em; }
.strip b em { font-style: italic; color: var(--mint); font-weight: 400; }
.strip span { display: block; margin-top: 10px; color: var(--dim); font-size: 14.5px; line-height: 1.45; }

.band { padding: 96px 0; border-bottom: 1px solid var(--line); }
.band.alt { background: var(--bg2); }
.head2 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; margin-bottom: 44px; align-items: end; }
.head2 h2 { grid-column: 1 / span 6; }
.head2 p { grid-column: 8 / span 5; color: var(--dim); margin: 0; }
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
.flow > div { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px; position: relative; }
.flow .k { font: 500 12.5px var(--mono); color: var(--faint); }
.flow h3 { margin: 10px 0 8px; }
.flow p { font-size: 15px; color: var(--dim); margin: 0; }
.flow .num { font: 600 34px var(--serif); color: var(--mint); margin-top: 14px; }
.flow .num.gold { color: var(--gold); }
.flow > div.ai { border-color: var(--gold-deep); background: linear-gradient(160deg, #2A2A10 0%, var(--panel) 55%); }
.honest { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; }
.honest > div { grid-column: span 6; }
.honest .q { font: italic 400 clamp(26px, 2.6vw, 36px)/1.25 var(--serif); color: #fff; }

/* desk */
.desk { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: calc(100vh - 64px); }
.list { border-right: 1px solid var(--line); background: var(--bg2); display: flex; flex-direction: column; max-height: calc(100vh - 64px); position: sticky; top: 64px; }
.list .filters { padding: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.list .seg { display: flex; background: var(--panel); border-radius: 999px; padding: 3px; }
.list .seg button { flex: 1; border: 0; background: transparent; padding: 6px 8px; border-radius: 999px; font-size: 13px; cursor: pointer; color: var(--dim); }
.list .seg button[aria-pressed="true"] { background: var(--mint); color: var(--bg); font-weight: 600; }
.list .items { overflow-y: auto; flex: 1; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover { background: var(--panel); }
.item[aria-current="true"] { background: var(--panel2); box-shadow: inset 3px 0 0 var(--mint); }
.item .id { font: 500 14px var(--mono); color: #fff; }
.item .sub { grid-column: 1 / -1; font-size: 13px; color: var(--dim); display: flex; gap: 10px; align-items: center; }
.item .risk { font: 500 13px var(--mono); }
.rbar { display: inline-block; width: 60px; height: 5px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; vertical-align: middle; }
.rbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--mint); }
.pill { display: inline-block; font: 500 11.5px var(--mono); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line2); color: var(--dim); }
.pill.esc { border-color: var(--gold-deep); color: var(--gold); }
.pill.dis { color: var(--dim); }

.case { padding: 28px 32px 60px; min-width: 0; }
.case-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 12px 28px; margin-bottom: 20px; }
.case-top .facts { grid-column: 1 / -1; }
.case-top h1 { font-size: clamp(36px, 4vw, 54px); font-weight: 600; letter-spacing: -0.02em; }
.case-top .facts { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--dim); font-size: 14px; }
.case-top .facts b { color: #fff; font-weight: 600; }
.case-top .acts { display: flex; gap: 10px; padding-bottom: 8px; grid-column: 2; grid-row: 1; }
.case-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 22px; }
.mapcard { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; position: relative; min-width: 0; }
.mapcard .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 18px; border-bottom: 1px solid var(--line); font: 400 13px var(--mono); color: var(--dim); }
.mapcard .bar .now { color: var(--gold); }
.mapcard .bar .key { margin-left: auto; display: flex; gap: 14px; }
.mapcard .bar .key i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
#map { width: 100%; display: block; height: auto; }
.edge { fill: none; stroke-linecap: round; transition: opacity .6s, stroke .4s; }
.edge.flow { stroke-dasharray: 2 9; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -22; } }
.edge.base { opacity: .28; }
.edge.hide, .node.hide, .amt.hide { opacity: 0; }
.node circle { transition: r .4s, fill .4s, stroke .4s; }
.node text { font: 500 11.5px var(--mono); fill: var(--dim); }
.node.focus circle.core { stroke: var(--gold); stroke-width: 3; }
.node.alerted text { fill: #fff; font-weight: 500; }
.halo { fill: none; stroke: var(--gold); stroke-width: 2; opacity: 0; }
.halo.on { animation: halo 1.4s ease-out infinite; }
@keyframes halo { 0% { opacity: .9; r: 16; } 100% { opacity: 0; r: 46; } }
.amt { font: 500 11px var(--mono); fill: var(--gold); transition: opacity .5s; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
.peek { position: absolute; pointer-events: none; background: rgba(4,33,26,.95); border: 1px solid var(--gold-deep); border-radius: 12px; padding: 10px 12px; font-size: 13px; max-width: 260px; opacity: 0; transform: translateY(4px); transition: opacity .3s, transform .3s; z-index: 4; }
.peek.on { opacity: 1; transform: none; }
.peek b { font-family: var(--mono); color: var(--gold); }

.ledger { margin-top: 20px; }
.ledger table { width: 100%; border-collapse: collapse; font-size: 14px; }
.ledger th { text-align: left; font: 500 12px var(--mono); color: var(--faint); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.ledger td { padding: 9px 10px; border-bottom: 1px solid rgba(29,84,67,.6); transition: background .5s, color .5s; }
.ledger td.num { font-family: var(--mono); text-align: right; }
.ledger tr.off td { color: var(--faint); }
.ledger tr.lit td { background: rgba(255,194,61,.08); }
.ledger td .acct { font-family: var(--mono); cursor: pointer; }
.ledger td .acct.me { color: var(--gold); }

.file { background: #F3FAF6; color: #0B2A21; border-radius: 22px; padding: 22px 22px 24px; position: relative; overflow: hidden; }
.file h3 { color: #0B2A21; font-size: 22px; }
.file .k { font: 500 12px var(--mono); color: #4E7465; }
.file .stamp { position: absolute; right: 20px; top: 52px; font: 800 15px var(--serif); letter-spacing: .02em; padding: 6px 12px; border: 2.5px solid; border-radius: 6px; transform: rotate(4deg); opacity: 0; transition: opacity .5s, transform .5s; }
.file .stamp.on { opacity: 1; transform: rotate(-4deg); }
.file .stamp.esc { color: #B37800; border-color: #B37800; }
.file .stamp.dis { color: #3A6355; border-color: #3A6355; }
.dial { display: flex; align-items: center; gap: 16px; margin: 16px 0 10px; }
.dial svg { width: 120px; height: 66px; flex: none; }
.dial .v { font: 600 34px var(--serif); line-height: 1; }
.dial small { display: block; font-size: 12.5px; color: #4E7465; margin-top: 4px; }
.file .typ { display: inline-block; font: 500 12.5px var(--mono); background: #0B2A21; color: var(--mint); border-radius: 999px; padding: 3px 10px; margin: 4px 0 12px; }
.file ul { padding-left: 18px; margin: 6px 0 14px; font-size: 14px; }
.file li { margin: 5px 0; }
.file .narr { font: 400 16px/1.55 var(--serif); color: #12352B; min-height: 4em; }
.file .inn { font-size: 14px; color: #3A6355; border-left: 3px solid #BFD9CC; padding-left: 12px; margin-top: 12px; }
.file .truth { margin-top: 16px; padding-top: 14px; border-top: 1px dashed #A9C9BA; font-size: 14px; }
.file .truth button { border: 1px solid #0B2A21; background: transparent; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; color: #0B2A21; }
.caret::after { content: "▍"; color: var(--gold-deep); animation: blink .8s infinite; }
@keyframes blink { 50% { opacity: 0; } }

.trail { margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
.trail h3, .ledger h3 { font-size: 17px; margin-bottom: 8px; }
.trail h3 small, .ledger h3 small { font: 400 12px var(--mono); color: var(--faint); margin-left: 8px; }
#trail { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 22px; }
.side-col { position: sticky; top: 84px; align-self: start; }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; animation: rise .3s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }
.step .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #1F1600; font: 600 12px var(--mono); }
.step .av.code { background: var(--panel2); color: var(--mint); border: 1px solid var(--line2); border-radius: 8px; }
.step .t { font: 500 12.5px var(--mono); color: var(--gold); }
.step .g { color: var(--dim); }
.thinking { background: linear-gradient(90deg, var(--gold-deep), #FFF2C8, var(--gold-deep)); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.4s linear infinite; font-weight: 600; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

/* results */
.page { padding-top: 56px; padding-bottom: 40px; }
.page-head { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; margin-bottom: 40px; align-items: end; }
.page-head h1 { grid-column: 1 / span 7; font-size: clamp(42px, 5vw, 72px); line-height: 1; letter-spacing: -0.02em; }
.page-head p { grid-column: 8 / span 5; color: var(--dim); margin: 0; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 22px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .axis { stroke: var(--line2); }
.chart text { fill: var(--dim); font: 400 12px var(--mono); }
.two { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; }
.two > div { grid-column: span 6; min-width: 0; }
.kv { display: grid; gap: 0; }
.kv div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.kv b { font-family: var(--mono); color: #fff; font-weight: 500; white-space: nowrap; }
.section { margin: 56px 0; }
.section h2 { margin-bottom: 16px; }
.two h2 { font-size: clamp(28px, 2.6vw, 36px); }
ul.limits li { margin: 8px 0; color: var(--dim); max-width: 90ch; }
.cards3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.cards3 > div { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
.cards3 b { display: block; font: 600 40px var(--serif); color: #fff; }
.cards3 span { color: var(--dim); font-size: 14.5px; }

footer { padding: 28px 0 44px; color: var(--faint); font-size: 13px; border-top: 1px solid var(--line); }
#tip { position: fixed; z-index: 60; pointer-events: none; background: #021812; border: 1px solid var(--line2); border-radius: 10px; padding: 9px 11px; font: 400 12.5px/1.45 var(--mono); max-width: 320px; opacity: 0; transition: opacity .12s; }
#tip.on { opacity: 1; }

@media (max-width: 1100px) {
  .case-grid { grid-template-columns: minmax(0, 1fr); }
  .side-col { position: static; }
  .main-col { display: contents; }
  .mapcard { order: 1; } .side-col { order: 2; } .trail { order: 3; margin-top: 0; } .ledger { order: 4; margin-top: 0; }
  .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .hero .copy, .head2 h2, .head2 p, .honest > div, .page-head h1, .page-head p, .two > div { grid-column: 1 / -1; }
  .shade { background: linear-gradient(180deg, rgba(4,33,26,.2) 0%, rgba(4,33,26,.9) 45%, rgba(4,33,26,.96) 100%); }
  .hero .wrap { align-content: end; padding-top: 260px; }
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .strip div { border-right: 0; padding-left: 0 !important; border-bottom: 1px solid var(--line); }
  .desk { grid-template-columns: minmax(0, 1fr); }
  .list { position: static; max-height: 300px; border-right: 0; border-bottom: 1px solid var(--line); }
  .cards3 { grid-template-columns: minmax(0, 1fr); }
  .top .meta { display: none; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .top .wrap { gap: 10px; }
  .brand span { display: none; }
  .nav a { padding: 6px 10px; font-size: 14px; }
  .flow { grid-template-columns: minmax(0, 1fr); }
  .case { padding: 20px 16px 40px; }
  .case-top { grid-template-columns: minmax(0, 1fr); }
  .case-top .acts { grid-column: 1; grid-row: auto; }
  .ledger .hide-s { display: none; }
  #trail { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/" aria-label="AML Sentinel home"><svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="7" cy="22" r="3.2" fill="#2EF2A6"/><circle cx="15" cy="9" r="3.2" fill="#2EF2A6"/><circle cx="23" cy="20" r="4.2" fill="#FFC23D"/><path d="M7 22 L15 9 L23 20 M7 22 L23 20" stroke="#2EF2A6" stroke-width="1.6" fill="none"/></svg><span>AML Sentinel</span></a>
  <nav class="nav" aria-label="Main"><a href="#/desk" data-r="desk">Case desk</a><a href="#/results" data-r="results">Results</a><a href="#/how" data-r="how">How it works</a></nav>
  <span class="meta">IBM AML benchmark, held-out days</span>
</div></header>
<main id="view"></main>
<div id="tip" role="tooltip"></div>
<footer><div class="wrap">Data: IBM Transactions for Anti Money Laundering (Altman et al., NeurIPS 2023), synthetic. Agent: Claude Haiku 4.5 with read-only ledger tools. Built by Divya Sri.</div></footer>
<script>
const DATA = /*DATA*/null;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const F = DATA.facts, C = DATA.cases, CI = Object.fromEntries(C.map(c => [c.id, c]));
const pct = (x, d = 0) => (x * 100).toFixed(d) + "%";
const usd = x => x >= 1e6 ? "$" + (x / 1e6).toFixed(1) + "M" : x >= 1e3 ? "$" + (x / 1e3).toFixed(x >= 1e4 ? 0 : 1) + "K" : "$" + Math.round(x);
const TYP = { fan_out: "Fan-out", fan_in: "Fan-in", scatter_gather: "Scatter-gather", gather_scatter: "Gather-scatter", cycle: "Cycle", stack: "Stack", bipartite: "Bipartite", random: "Random", other: "Other", none: "No pattern" };
const sleep = ms => new Promise(r => setTimeout(r, reduced ? 0 : ms));
const tip = $("#tip");
function showTip(html, ev) { tip.innerHTML = html; tip.classList.add("on"); const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY + 14; if (x + w > innerWidth - 8) x = ev.clientX - w - 14; if (y + h > innerHeight - 8) y = ev.clientY - h - 14; tip.style.left = x + "px"; tip.style.top = y + "px"; }
const hideTip = () => tip.classList.remove("on");

/* ------------------------------------------------ force layout for a small payment network */
function layout(c, W, H) {
  const ids = [...new Set([c.acct, ...c.pay.flatMap(p => [p.from, p.to])])];
  const N = ids.map((id, i) => { const a = (i / ids.length) * Math.PI * 2; return { id, x: W / 2 + (i ? Math.cos(a) * W * 0.3 : 0), y: H / 2 + (i ? Math.sin(a) * H * 0.3 : 0) }; });
  const ix = Object.fromEntries(N.map((n, i) => [n.id, i]));
  const E = c.pay.map(p => [ix[p.from], ix[p.to]]);
  const L = Math.min(W, H) * 0.32, k = L * L * 0.9;
  for (let it = 0; it < 320; it++) {
    const f = N.map(() => [0, 0]);
    for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
      let dx = N[i].x - N[j].x, dy = N[i].y - N[j].y, d2 = dx * dx + dy * dy + 0.01, r = k / d2, d = Math.sqrt(d2);
      f[i][0] += dx / d * r; f[i][1] += dy / d * r; f[j][0] -= dx / d * r; f[j][1] -= dy / d * r; }
    for (const [a, b] of E) { const dx = N[b].x - N[a].x, dy = N[b].y - N[a].y, d = Math.hypot(dx, dy) + 0.01, s = (d - L) * 0.08;
      f[a][0] += dx / d * s; f[a][1] += dy / d * s; f[b][0] -= dx / d * s; f[b][1] -= dy / d * s; }
    const t = 1 - it / 320;
    N.forEach((n, i) => { if (i === 0) { n.x = W / 2; n.y = H / 2; return; }
      n.x += Math.max(-20, Math.min(20, f[i][0] + (W / 2 - n.x) * 0.01)) * t; n.y += Math.max(-20, Math.min(20, f[i][1] + (H / 2 - n.y) * 0.01)) * t;
      n.x = Math.max(60, Math.min(W - 60, n.x)); n.y = Math.max(40, Math.min(H - 40, n.y)); });
  }
  // stretch the settled layout to fill the panel, keeping the alerted account where it ended up relative to the rest
  const xs = N.map(n => n.x), ys = N.map(n => n.y), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const sx = (W - 160) / Math.max(1, x1 - x0), sy = (H - 100) / Math.max(1, y1 - y0), sc = Math.min(sx, sy, 2.4);
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  N.forEach(n => { n.x = W / 2 + (n.x - cx) * Math.min(sx, sc * 1.35); n.y = H / 2 + (n.y - cy) * sc; });
  return { N, ix };
}

function heroNet(canvas) {
  const ctx = canvas.getContext("2d"), dpr = devicePixelRatio || 1; let W, H, clusters = [], parts = [], raf = 0, alive = true;
  const pick = C.filter(c => c.pay.length >= 3).slice(0, 44);
  function build() {
    W = canvas.clientWidth; H = canvas.clientHeight; canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const narrow = W < 900, cols = narrow ? 4 : 7, rows = Math.ceil(pick.length / cols), cw = W / cols, ch = H / rows;
    let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    clusters = pick.map((c, i) => {
      const feat = c.id === DATA.featured, s = feat ? (narrow ? 230 : 330) : Math.min(cw, ch) * 0.9;
      const cx = feat ? (narrow ? W * 0.5 : W * 0.73) : (i % cols + 0.5) * cw + (rnd() - 0.5) * cw * 0.3, cy = feat ? (narrow ? 150 : H * 0.5) : (Math.floor(i / cols) + 0.5) * ch + (rnd() - 0.5) * ch * 0.3;
      const { N, ix } = layout(c, s, s); N.forEach(n => { n.x += cx - s / 2; n.y += cy - s / 2; });
      return { c, N, ix, feat, edges: c.pay.map(p => ({ a: N[ix[p.from]], b: N[ix[p.to]], w: Math.log10(p.usd + 10) })) };
    }).filter(k => k.feat || Math.hypot(k.N[0].x - (narrow ? W * 0.5 : W * 0.73), k.N[0].y - (narrow ? 150 : H * 0.5)) > (narrow ? 170 : 240));
    parts = []; clusters.forEach(k => k.edges.forEach(e => { for (let j = 0; j < (k.feat ? 3 : 1); j++) parts.push({ k, e, t: rnd(), v: 0.002 + rnd() * 0.004 }); }));
    const tag = $("#tag"), f = clusters.find(k => k.feat);
    if (tag && f) { const out = f.c.pay.filter(p => p.from === f.c.acct).reduce((a, p) => a + p.usd, 0), inn = f.c.pay.filter(p => p.to === f.c.acct).reduce((a, p) => a + p.usd, 0);
      tag.innerHTML = `Agent traced ${f.c.acct}<b>${f.c.pay.filter(p => p.to === f.c.acct).length} payments in (${usd(inn)}), ${f.c.pay.filter(p => p.from === f.c.acct).length} out (${usd(out)})</b>Escalated: ${TYP[f.c.typ]}`;
      tag.style.left = Math.min(W - 300, f.N[0].x + 30) + "px"; tag.style.top = (narrow ? 20 : f.N[0].y + 150) + "px"; }
  }
  build();

  function frame(now) {
    if (!alive) return;
    const s = (now - t0) / 1000; ctx.clearRect(0, 0, W, H);
    for (const k of clusters) {
      const lit = k.feat ? Math.min(1, Math.max(0, (s - 1.2) / 1.5)) : 0;
      for (const e of k.edges) { ctx.strokeStyle = k.feat ? `rgba(255,194,61,${0.25 + 0.6 * lit})` : "rgba(46,242,166,.13)"; ctx.lineWidth = k.feat ? e.w * 0.55 : 1; ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); ctx.stroke(); }
      for (const n of k.N) { const me = n === k.N[0]; ctx.fillStyle = k.feat ? (me ? "#FFC23D" : "#FFE39A") : (me ? "rgba(46,242,166,.75)" : "rgba(46,242,166,.4)"); ctx.beginPath(); ctx.arc(n.x, n.y, k.feat ? (me ? 9 : 5) : (me ? 3 : 2), 0, 7); ctx.fill(); }
      if (k.feat && lit > 0.2) { const r = 14 + ((s * 26) % 50); ctx.strokeStyle = `rgba(255,194,61,${Math.max(0, 0.8 - r / 70)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(k.N[0].x, k.N[0].y, r, 0, 7); ctx.stroke(); }
    }
    for (const p of parts) { p.t += p.v * (p.k.feat ? 1.4 : 1); if (p.t > 1) p.t -= 1; const x = p.e.a.x + (p.e.b.x - p.e.a.x) * p.t, y = p.e.a.y + (p.e.b.y - p.e.a.y) * p.t;
      ctx.fillStyle = p.k.feat ? "#FFF2C8" : "rgba(46,242,166,.85)"; ctx.beginPath(); ctx.arc(x, y, p.k.feat ? 2.4 : 1.4, 0, 7); ctx.fill(); }
    if (s > 2.6) $("#tag")?.classList.add("on");
    raf = reduced ? 0 : requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  const ro = new ResizeObserver(() => build()); ro.observe(canvas);
  stopAll = () => { alive = false; cancelAnimationFrame(raf); ro.disconnect(); };
}

  const now = $("#now"); const setNow = t => { if (now) now.innerHTML = t; };
  const reveal = (i, gold) => { $(`#eb${i}`)?.classList.remove("hide"); const f = $(`#ef${i}`); f?.classList.remove("hide"); if (gold && f) f.setAttribute("stroke", "var(--gold)");
    const p = c.pay[i]; $(`#n-${p.from}`)?.classList.remove("hide"); $(`#n-${p.to}`)?.classList.remove("hide"); $(`#lg${i}`).className = "lit"; };
  setNow(`<span class="thinking">Agent is reading the alert…</span>`);
  const th = say("", "AI", "Claude Haiku 4.5", `<span class="thinking">Thinking about which ledger lookup to make first…</span>`);
  await sleep(1300); if (!ok()) return; th.remove();
  const steps = c.steps.length ? c.steps : [{ tool: "account_summary", on: c.acct, got: "summary returned" }];
  for (const s of steps) {
    const node = $(`#n-${s.on}`); $$("#map .node").forEach(n => n.classList.remove("focus")); $$("#map .halo").forEach(h => h.classList.remove("on"));
    if (node) { node.classList.remove("hide"); node.classList.add("focus"); $(".halo", node).classList.add("on"); }
    setNow(`<span class="thinking">${esc(s.tool)}(${esc(s.on)})</span>`);
    const d = say("", "AI", `${esc(s.tool)}(${esc(s.on)})`, `<span class="thinking">running…</span>`);
    await sleep(500); if (!ok()) return;
    if (s.tool === "trace_new_relationships") for (let i = 0; i < c.pay.length; i++) { reveal(i, c.pay[i].from === c.acct || c.pay[i].to === c.acct); await sleep(160); if (!ok()) return; }
    if (s.tool === "get_transactions" || s.tool === "list_first_time_payments") for (let i = 0; i < c.pay.length; i++) { reveal(i, true); $(`#ea${i}`)?.classList.remove("hide"); await sleep(110); if (!ok()) return; }
    if (s.tool === "account_summary" && s.on !== c.acct) { $$(`#map .edge`).forEach(e => e.style.opacity = ""); peek(s.on, `<b>${esc(s.on)}</b><br>${esc(s.got)}`); }
    $(".g", d).textContent = s.got;
    await sleep(s.tool === "account_summary" ? 900 : 500); if (!ok()) return;
    $("#peek")?.classList.remove("on");
  }
  if (!c.steps.length) c.pay.forEach((_, i) => reveal(i, true));
  c.pay.forEach((_, i) => { $(`#ea${i}`)?.classList.remove("hide"); });
  $$("#map .node").forEach(n => { n.classList.remove("hide", "focus"); }); $$("#map .halo").forEach(h => h.classList.remove("on"));
  setNow(`<span class="thinking">Writing the case file…</span>`);
  const w = say("", "AI", "Writing the case file", `<span class="thinking">drafting the narrative…</span>`);
  $("#dialv").setAttribute("stroke-dasharray", `${c.risk} 100`); $("#riskv").textContent = c.risk; $("#typ").textContent = TYP[c.typ] || c.typ;
  $("#evl").innerHTML = c.ev.slice(0, 5).map(e => `<li>${esc(e)}</li>`).join("");
  await stream($("#narr"), c.narr, Math.min(3200, c.narr.length * 7)); if (!ok()) return;
  $("#inn").hidden = false; $("#stamp").classList.add("on"); $(".g", w).textContent = `Recommended ${c.disp}. Every account it names is checked against the evidence it retrieved.`;
  say("code", "✓", "Check, in code", `${c.linked.length} linked account(s) named; all appear in the ledger evidence.`);
  setNow(`Agent finished: <b>${c.disp === "escalate" ? "escalate" : "dismiss"}</b>, risk ${c.risk}. A person decides.`);
}

/* ------------------------------------------------ results */
function viewResults(v) {
  const W = 640, H = 380, px = x => 50 + x * (W - 70), py = y => H - 40 - y * (H - 70);
  const line = (pts, col, wd, dash) => `<path d="M${pts.map(([x, y]) => `${px(x).toFixed(1)},${py(y).toFixed(1)}`).join(" L")}" fill="none" stroke="${col}" stroke-width="${wd}" ${dash ? `stroke-dasharray="${dash}"` : ""}/>`;
  const grid = [0, .2, .4, .6, .8, 1].map(t => `<line class="axis" x1="${px(0)}" x2="${px(1)}" y1="${py(t)}" y2="${py(t)}" style="opacity:.35"/><text x="${px(0) - 8}" y="${py(t) + 4}" text-anchor="end">${t * 100}%</text><text x="${px(t)}" y="${H - 16}" text-anchor="middle">${t * 100}%</text>`).join("");
  const k80 = F.keep80.share_of_alerts;
  const curve = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Share of true alerts kept against share of alerts read">${grid}
    ${line([[0, 0], [1, 1]], "var(--line2)", 1.5, "4 5")}${line(DATA.curves.full, "var(--mint)", 3)}
    <line x1="${px(k80)}" x2="${px(k80)}" y1="${py(0)}" y2="${py(0.8)}" stroke="var(--gold)" stroke-dasharray="3 4"/><line x1="${px(0)}" x2="${px(k80)}" y1="${py(0.8)}" y2="${py(0.8)}" stroke="var(--gold)" stroke-dasharray="3 4"/>
    <circle cx="${px(k80)}" cy="${py(0.8)}" r="6" fill="var(--gold)"/><text x="${px(k80) + 12}" y="${py(0.8) + 18}" style="fill:var(--gold)">read ${pct(k80)} of alerts, keep 80%</text>
    <text x="${px(0.62)}" y="${py(0.5)}" style="fill:var(--faint)">reading in random order</text></svg>`;
  const both = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Agent ranking against model ranking">${grid}${line([[0, 0], [1, 1]], "var(--line2)", 1.5, "4 5")}
    ${line(DATA.curves.model.map(([x, y]) => [x, y]), "var(--mint)", 3)}${line(DATA.curves.agent.map(([x, y]) => [x, y]), "var(--gold)", 3)}
    <text x="${px(0.22)}" y="${py(0.86)}" style="fill:var(--mint)">model, AUC ${F.auc_model.toFixed(2)}</text><text x="${px(0.5)}" y="${py(0.58)}" style="fill:var(--gold)">agent, AUC ${F.auc_agent.toFixed(2)}</text></svg>`;
  v.innerHTML = `<div class="wrap page"><div class="page-head"><h1>Results</h1><p>Held-out test days (7 to 9) of IBM HI-Small. Everything was tuned on days 4 and 5. Every rate comes with a confidence interval in the repository.</p></div>
  <div class="cards3"><div><b>${pct(F.keep80.workload_reduction)}</b><span>workload cut keeping 80% of true alerts (${pct(F.keep90.workload_reduction)} at 90%)</span></div>
    <div><b>${F.auc_full.toFixed(2)}</b><span>AUC of the ranking model on all ${F.alerts.toLocaleString()} test alerts</span></div>
    <div><b>${pct(F.faith.case_files_fully_traceable.rate)}</b><span>of ${F.faith.case_files_checked} case files fully traceable to retrieved evidence</span></div></div>
  <div class="two section"><div class="chart"><h3 style="margin-bottom:10px">The model: read less, keep the real ones</h3>${curve}</div>
    <div class="chart"><h3 style="margin-bottom:10px">The agent ranks worse than the model</h3>${both}<p class="muted" style="font-size:14px;margin-top:10px">On ${F.sample} held-out alerts. Gap ${F.gap.toFixed(2)} (95% interval ${F.gap_ci[0].toFixed(2)} to ${F.gap_ci[1].toFixed(2)}). Averaging the two scored ${F.auc_combined.toFixed(2)}, worse than the model alone.</p></div></div>
  <div class="two section"><div><h2>What the agent is good at</h2><div class="kv">
      <div><span>Accounts named in case files found in its evidence</span><b>${F.faith.accounts_cited_grounded.count} / ${F.faith.accounts_cited_grounded.of}</b></div>
      <div><span>Dollar amounts found in its evidence</span><b>${F.faith.amounts_found_in_evidence.count} / ${F.faith.amounts_found_in_evidence.of}</b></div>
      <div><span>Amounts it could not support</span><b>${F.faith.amounts_unsupported.count}</b></div>
      <div><span>True alerts it escalated</span><b>${F.agent_true.count} / ${F.agent_true.of}</b></div>
      <div><span>False alarms it dismissed</span><b>${F.agent_false.count} / ${F.agent_false.of}</b></div>
      <div><span>Average time and input per case</span><b>${F.seconds.toFixed(0)}s, ${Math.round(F.tokens_in / 1000)}K tokens</b></div></div></div>
    <div><h2>Same method, second dataset</h2><div class="kv">
      <div><span>LI-Small alerts (nothing re-tuned)</span><b>${F.li.rules.alerts.toLocaleString()}</b></div>
      <div><span>Real alerts among them</span><b>${pct(F.li.rules.precision, 1)}</b></div>
      <div><span>Laundering on alerted accounts</span><b>${pct(F.li.rules.laundering_transaction_recall)}</b></div>
      <div><span>Laundering on alerted accounts, HI-Small</span><b>${pct(F.txn_recall)}</b></div></div></div></div>
  <div class="section"><h2>What these results do not show</h2><ul class="limits">
    <li>The data is synthetic. Real bank data has messier identities, more products and labels that arrive months late.</li>
    <li>${pct(1 - F.txn_recall)} of laundering transactions never reach an alerted account: the rules miss them, and nothing downstream can recover them.</li>
    <li>The agent names the right scheme type for only a small share of laundering cases; typology is a hint, not a finding.</li>
    <li>The agent's sample is ${F.sample} alerts from the review band, re-weighted to the true mix; its intervals are wider than the model's.</li></ul></div></div>`;
}

/* ------------------------------------------------ how it works */
function viewHow(v) {
  v.innerHTML = `<div class="wrap page"><div class="page-head"><h1>How it works</h1><p>Rules stay as the auditable net, a model ranks at no cost per alert, an agent investigates and writes, a person decides.</p></div>
  <div class="flow">
    <div><span class="k">Rules</span><h3>Four rules</h3><p>${Object.entries(DATA.rules).map(([k, t]) => `<b>${k}</b> ${esc(t)}`).join("<br>")}</p></div>
    <div><span class="k">Model</span><h3>Gradient-boosted trees</h3><p>27 evidence features about each alerted account's first-time relationships, history and currencies. Time split: tuned on days 4 and 5, reported on 7 to 9.</p></div>
    <div class="ai"><span class="k">Agent</span><h3>Tool-use loop</h3><p>Read-only ledger tools: account summary, trace new relationships, list first-time payments, get transactions. Labels are removed from everything it can see.</p></div>
    <div><span class="k">Safeguards</span><h3>Fail safe to a person</h3><p>Step and token limits; any error escalates to a human; every account it names must appear in its evidence; a full trace is kept per alert.</p></div>
  </div>
  <div class="section cards3"><div><b>${F.tests}</b><span>unit tests run on every push</span></div><div><b>${F.failsafe}</b><span>fail-safe escalations in the held-out run</span></div><div><b>${(F.band / 3).toFixed(0)}</b><span>alerts a day in the review band the agent works</span></div></div></div>`;
}

route();
</script>
